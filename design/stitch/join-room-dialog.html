<style>
        .texture-overlay {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
        }
        .pressed-effect:active {
            transform: translateY(2px);
            box-shadow: none;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen antialiased flex items-center justify-center relative overflow-hidden">
<!-- Background element to simulate app underneath -->
<div class="absolute inset-0 z-0 bg-surface flex flex-col">
<header class="w-full bg-surface-container shadow-sm px-lg py-md flex justify-between items-center h-20">
<div class="text-title-md font-title-md font-bold text-primary tracking-tight">Dealopoly</div>
</header>
<main class="flex-1 p-lg grid grid-cols-12 gap-md opacity-30">
<div class="col-span-12 md:col-span-8 bg-surface-container-low rounded-xl h-96 border border-outline-variant"></div>
<div class="col-span-12 md:col-span-4 bg-surface-container-low rounded-xl h-96 border border-outline-variant"></div>
</main>
</div>
<!-- Blur Overlay -->
<div class="absolute inset-0 z-10 bg-black/60 backdrop-blur-md"></div>
<!-- Modal Dialog -->
<div class="relative z-20 bg-surface-container-high rounded-xl border border-outline-variant shadow-2xl w-[90%] max-w-[440px] overflow-hidden">
<div class="absolute inset-0 texture-overlay"></div>
<!-- Header -->
<div class="flex justify-between items-center px-lg py-md border-b border-outline-variant/30 relative">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Join Game Room</h2>
<button aria-label="Close" class="text-on-surface-variant hover:text-primary transition-colors duration-200 p-sm rounded-full hover:bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Body -->
<div class="p-lg flex flex-col gap-xl relative">
<div class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="roomCode">Room Code</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="meeting_room">meeting_room</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg py-md pl-xl pr-md text-on-surface font-label-sm text-body-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant/70 tracking-widest uppercase" id="roomCode" maxlength="6" placeholder="Enter 6-digit code" type="text"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="playerName">Your Name <span class="text-outline-variant/70 normal-case tracking-normal">(Optional)</span></label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg py-md pl-xl pr-md text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant/70" id="playerName" placeholder="Guest Player" type="text"/>
</div>
</div>
</div>
<!-- Footer / Actions -->
<div class="pt-sm">
<button class="w-full bg-primary-container text-on-primary-container font-title-md text-title-md py-md rounded-lg hover:bg-primary hover:text-on-primary transition-all shadow-[0_4px_0_0_rgba(0,48,97,0.5)] pressed-effect flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" data-icon="login">login</span>
                    Join Room
                </button>
</div>
</div>
</div>
</body></html>
