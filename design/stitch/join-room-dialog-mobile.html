<div class="absolute inset-0 z-0">

<div class="fixed inset-0 scrim z-40 transition-opacity duration-300"></div>

<div class="w-full max-w-md bg-surface-container-high rounded-t-xl z-50 transform transition-transform duration-300 ease-out translate-y-0 shadow-[0_-8px_30px_rgba(0,0,0,0.5)]">
<!-- Drag Handle Indicator -->
<div class="w-full flex justify-center pt-sm pb-2">
<div class="w-12 h-1 bg-outline-variant rounded-full"></div>
</div>
<!-- Header -->
<div class="flex justify-between items-center px-lg py-md border-b border-surface-container-highest">
<h2 class="font-title-md text-title-md text-on-surface">Join Game Room</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors active:scale-95 flex items-center justify-center p-sm rounded-full hover:bg-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Content Area -->
<div class="p-lg flex flex-col gap-lg">
<!-- Instructions -->
<p class="font-body-md text-body-md text-on-surface-variant text-center">
                Enter the 6-digit room code provided by the host to join their game.
            </p>
<!-- Input Field Group -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest pl-sm" for="roomCode">Room Code</label>
<div class="relative">
<input autocomplete="off" class="room-code-input w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg py-md px-md font-label-sm text-display-lg text-primary placeholder-on-surface-variant/30 transition-all duration-200" id="roomCode" inputmode="numeric" maxlength="6" pattern="[0-9]*" placeholder="000000" type="text"/>
</div>
<!-- Validation/Helper Text (hidden by default, shown for demo) -->
<!-- <p class="font-label-sm text-label-sm text-error pl-sm">Invalid code. Please try again.</p> -->
</div>
<!-- Recent Rooms (Optional fast-join) -->
<div class="flex flex-col gap-sm mt-md">
<h3 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest pl-sm">Recent</h3>
<button class="flex items-center justify-between w-full bg-surface-container py-md px-md rounded-lg border border-transparent hover:border-outline-variant/30 transition-all active:scale-[0.98]">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">groups</span>
</div>
<div class="flex flex-col items-start">

<span class="font-label-sm text-label-sm text-on-surface-variant">Code: 849201</span>
</div>
</div>
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">arrow_forward_ios</span>
</button>
</div>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">login</span>
                    Join Room
                </button>
</div>
