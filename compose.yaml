services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dealopoly
      POSTGRES_USER: dealopoly
      POSTGRES_PASSWORD: dealopoly
    ports:
      - "5432:5432"
    volumes:
      - dealopoly-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealopoly -d dealopoly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dealopoly-postgres:
